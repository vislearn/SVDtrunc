[project]
name = "svdtrunc"
version = "1.0.0"
description = "SVDtrunc: importance-aware low-rank compression of FLUX.1-dev (ECCV 2026)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/svdtrunc/flux/LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "torch>=2.6",
    "transformers>=4.51",
]

[project.urls]
"Project page" = "https://vislearn.github.io/SVDtrunc/"
Paper = "https://arxiv.org/abs/2609.04646"
Repository = "https://github.com/vislearn/SVDtrunc"

[project.scripts]
svdtrunc = "svdtrunc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svdtrunc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/svdtrunc/flux"]
